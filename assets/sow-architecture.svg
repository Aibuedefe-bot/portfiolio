<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#B3245C"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#FFFFFF"/>

  <text x="24" y="34" font-size="13" font-weight="600" fill="#2B1622">Scope-of-work generator</text>
  <text x="24" y="54" font-size="11.5" fill="#7C6570">Plain-language brief in, drafted document out. Runs as an MCP tool inside the team's existing client.</text>

  <g stroke="#F0D3DD" fill="#FDF6F8">
    <rect x="24"  y="92" width="140" height="76" rx="6"/>
    <rect x="204" y="92" width="140" height="76" rx="6"/>
    <rect x="384" y="92" width="140" height="76" rx="6"/>
    <rect x="564" y="92" width="140" height="76" rx="6"/>
    <rect x="724" y="92" width="132" height="76" rx="6"/>
  </g>

  <g font-size="12" font-weight="600" fill="#2B1622" text-anchor="middle">
    <text x="94"  y="122">Project brief</text>
    <text x="274" y="122">Structured</text><text x="274" y="138">extraction</text>
    <text x="454" y="122">Schema</text><text x="454" y="138">validation</text>
    <text x="634" y="122">Template fill</text>
    <text x="790" y="122">SOW draft</text>
  </g>
  <g font-size="10.5" fill="#7C6570" text-anchor="middle">
    <text x="94"  y="146">plain language</text>
    <text x="274" y="156">Bedrock</text>
    <text x="454" y="156">Pydantic</text>
    <text x="634" y="140">company template</text>
    <text x="790" y="140">ready to edit</text>
  </g>

  <g stroke="#B3245C" stroke-width="1.4" marker-end="url(#a)" fill="none">
    <path d="M170 130 H198"/>
    <path d="M350 130 H378"/>
    <path d="M530 130 H558"/>
    <path d="M710 130 H718"/>
  </g>

  <path d="M454 168 V206 H274 V174" stroke="#B3245C" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#a)"/>
  <text x="470" y="202" font-size="10.5" fill="#B3245C">invalid output is rejected and re-requested, never written to the template</text>

  <text x="24" y="252" font-size="10.5" fill="#7C6570">The validation step is the difference between a draft someone edits and a draft someone rewrites.</text>
  <text x="24" y="272" font-size="10.5" fill="#7C6570">Diagram is illustrative. No client data or proprietary detail included.</text>
</svg>
